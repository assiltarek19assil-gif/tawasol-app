<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الشركة - تواصل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .box { background: #ecf0f1; color: #333; padding: 20px; border-radius: 10px; max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #e74c3c; color: white; }
        .del-btn { background: #c0392b; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .post-box { background: white; margin: 10px 0; padding: 10px; border-radius: 8px; color: #333; text-align: right; }
    </style>
</head>
<body>
    <h1>🛡️ لوحة تحكم الإدارة (الشركة)</h1>
    
    <div class="box">
        <h3>👥 حسابات المستخدمين وكلمات السر</h3>
        <div id="usersList">جاري جلب البيانات...</div>
    </div>

    <div class="box" style="margin-top: 20px;">
        <h3>📝 الرقابة على المنشورات</h3>
        <div id="allPosts">جاري جلب المنشورات...</div>
    </div>

<script>
    const config = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(config);
    const db = firebase.database();

    // 1. جلب المستخدمين وكلمات سرهم
    db.ref('users').on('value', s => {
        let html = `<table><tr><th>الاسم</th><th>كلمة السر</th><th>الرمز (Tag)</th></tr>`;
        s.forEach(u => {
            const d = u.val();
            html += `<tr><td>${d.name}</td><td><b>${d.pass}</b></td><td>${d.tag}</td></tr>`;
        });
        html += `</table>`;
        document.getElementById('usersList').innerHTML = html;
    });

    // 2. جلب المنشورات مع إمكانية الحذف
    db.ref('posts').on('value', s => {
        let html = "";
        s.forEach(p => {
            const d = p.val();
            html += `<div class="post-box">
                <b>${d.u}:</b> ${d.t} 
                <button class="del-btn" onclick="deleteP('${p.key}')">حذف نهائي 🗑️</button>
            </div>`;
        });
        document.getElementById('allPosts').innerHTML = html;
    });

    function deleteP(id) {
        if(confirm("هل تريد حذف هذا المنشور من قاعدة البيانات؟")) {
            db.ref('posts/' + id).remove();
        }
    }
</script>
</body>
</html>
