<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الشركة - تواصل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <style>
        :root { --dark: #1a1a2e; --danger: #e94560; --card: #16213e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; }
        h1, h2, h3 { color: var(--danger); text-align: center; }
        .box { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #30475e; }
        
        /* تصميم جدول المستخدمين */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f3460; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #30475e; text-align: center; }
        th { background: var(--danger); }
        .pass-text { color: #f9ed69; font-weight: bold; }

        /* تصميم قسم المنشورات */
        .post-item { background: #0f3460; padding: 15px; border-radius: 8px; margin: 10px 0; border-right: 5px solid var(--danger); position: relative; }
        .del-btn { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; float: left; }
        .del-btn:hover { background: #ff2e63; }

        /* تصميم قسم الدردشات */
        .chat-room { background: #222831; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #393e46; }
        .msg-line { padding: 5px 0; border-bottom: 1px solid #393e46; font-size: 14px; }
        .sender-name { color: #00adb5; font-weight: bold; }
