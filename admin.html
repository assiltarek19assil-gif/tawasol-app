<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الشركة - الإدارة العليا</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --danger: #ff4757; --success: #2ed573; --dark: #2f3542; --light: #f1f2f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        header { background: var(--dark); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #57606f; }
        .ban-btn { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .unban-btn { background: var(--success); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .banned { background: #ffe0e3; color: var(--danger); }
        .active { background: #e3ffef; color: var(--success); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🛡️ لوحة التحكم الإدارية</h1>
        <p>مراقبة المستخدمين وإدارة الصلاحيات</p>
    </header>

    <div class="card">
        <h2>👥 قائمة المستخدمين</h2>
        <table id="userTable">
            <thead>
                <tr>
                    <th>المستخدم</th>
                    <th>كلمة السر</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="usersList">
                <tr><td colspan="4">جاري مزامنة البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب البيانات مع معالجة الأخطاء
    db.ref('users').on('value', s => {
        const list = document.getElementById('usersList');
        list.innerHTML = "";
        if(!s.exists()) { list.innerHTML = "<tr><td colspan='4'>لا يوجد مستخدمين بعد</td></tr>"; return; }
        
        s.forEach(u => {
            const d = u.val();
            const isBanned = d.status === 'banned';
            list.innerHTML += `
                <tr>
                    <td><b>${d.name || u.key}</b></td>
                    <td style="font-family: monospace;">${d.pass || '----'}</td>
                    <td><span class="status-badge ${isBanned ? 'banned' : 'active'}">${isBanned ? 'محظور' : 'نشط'}</span></td>
                    <td>
                        <button class="${isBanned ? 'unban-btn' : 'ban-btn'}" onclick="setBan('${u.key}', ${!isBanned})">
                            ${isBanned ? 'تفعيل الحساب' : 'إغلاق الحساب'}
                        </button>
                    </td>
                </tr>`;
        });
    });

    function setBan(uid, ban) {
        const status = ban ? 'banned' : 'active';
        db.ref('users/' + uid + '/status').set(status)
          .then(() => alert("تم تحديث حالة الحساب بنجاح"))
          .catch(e => alert("خطأ: " + e.message));
    }
</script>
</body>
</html>
