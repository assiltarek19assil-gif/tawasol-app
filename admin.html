<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم السرية للمسؤول</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        .section { background: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #1877f2; }
        .item { padding: 10px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        button { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .chat-box { background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 200px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🛡️ لوحة الإدارة العليا</h1>

    <div class="section">
        <h3>👥 المستخدمين (حظر/حذف)</h3>
        <div id="userList"></div>
    </div>

    <div class="section">
        <h3>📝 المنشورات (إزالة المخالف)</h3>
        <div id="postList"></div>
    </div>

    <div class="section">
        <h3>👁️ مراقبة الدردشات الحية</h3>
        <div id="chatWatch"></div>
    </div>

<script>
    const config = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(config);
    const db = firebase.database();

    // 1. إدارة المستخدمين
    db.ref('users').on('value', s => {
        const uL = document.getElementById('userList'); uL.innerHTML = "";
        s.forEach(u => {
            const d = u.val();
            uL.innerHTML += `<div class="item">
                <span>${d.name} [${d.status}]</span>
                <div>
                    <button style="background:#f39c12" onclick="toggleBan('${u.key}','${d.status}')">حظر/فك</button>
                    <button onclick="removeData('users/${u.key}')">حذف</button>
                </div>
            </div>`;
        });
    });

    // 2. إدارة المنشورات
    db.ref('posts').on('value', s => {
        const pL = document.getElementById('postList'); pL.innerHTML = "";
        s.forEach(p => {
            pL.innerHTML += `<div class="item">
                <span><b>${p.val().u}:</b> ${p.val().t.substring(0,20)}...</span>
                <button onclick="removeData('posts/${p.key}')">حذف المنشور</button>
            </div>`;
        });
    });

    // 3. مراقبة الدردشات
    db.ref('chats').on('value', s => {
        const cW = document.getElementById('chatWatch'); cW.innerHTML = "";
        s.forEach(room => {
            let messages = "";
            room.forEach(m => { messages += `[${m.val().s}]: ${m.val().t}\n`; });
            cW.innerHTML += `<div>
                <b>غرفة: ${room.key}</b>
                <pre class="chat-box">${messages}</pre>
                <button onclick="removeData('chats/${room.key}')">مسح السجل</button>
            </div><hr>`;
        });
    });

    function toggleBan(id, st) { db.ref('users/'+id+'/status').set(st==='banned'?'active':'banned'); }
    function removeData(path) { if(confirm("حذف نهائي؟")) db.ref(path).remove(); }
</script>
</body>
</html>
