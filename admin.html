<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الشركة - نظام الحظر</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --danger: #e94560; --bg: #1a1a2e; --card: #16213e; --success: #28a745; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; padding: 20px; }
        .section-box { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #30475e; }
        table { width: 100%; border-collapse: collapse; background: #0f3460; }
        th, td { padding: 12px; border: 1px solid #30475e; text-align: center; }
        th { background: var(--danger); }
        .ban-btn { background: var(--danger); color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .unban-btn { background: var(--success); color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .post-item { background: #1b262c; padding: 10px; border-radius: 8px; margin: 5px 0; border-right: 4px solid var(--danger); }
    </style>
</head>
<body>

<div style="max-width: 900px; margin: auto;">
    <h1>🛡️ لوحة التحكم: نظام إغلاق الحسابات</h1>

    <div class="section-box">
        <h2>👥 إدارة المستخدمين</h2>
        <div id="usersList">جاري التحميل...</div>
    </div>

    <div class="section-box">
        <h2>📝 الرقابة على المنشورات والدردشات</h2>
        <div id="logs">المحتوى يظهر هنا تلقائياً...</div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب المستخدمين مع ميزة الحظر
    db.ref('users').on('value', s => {
        let html = `<table><tr><th>الاسم</th><th>كلمة السر</th><th>الحالة</th><th>إجراء</th></tr>`;
        s.forEach(u => {
            const d = u.val();
            const isBanned = d.status === 'banned';
            html += `<tr>
                <td>${d.name || u.key}</td>
                <td style="color:#f9ed69">${d.pass}</td>
                <td style="color:${isBanned ? 'red' : '#28a745'}">${isBanned ? 'مغلق' : 'نشط'}</td>
                <td>
                    ${isBanned ? 
                        `<button class="unban-btn" onclick="toggleBan('${u.key}', 'active')">تفعيل</button>` : 
                        `<button class="ban-btn" onclick="toggleBan('${u.key}', 'banned')">إغلاق الحساب</button>`}
                </td>
            </tr>`;
        });
        html += `</table>`;
        document.getElementById('usersList').innerHTML = html;
    });

    function toggleBan(userId, newStatus) {
        if(confirm(`هل أنت متأكد من تغيير حالة حساب ${userId}؟`)) {
            db.ref('users/' + userId + '/status').set(newStatus);
        }
    }

    // عرض المنشورات للحذف
    db.ref('posts').on('value', s => {
        let html = "";
        s.forEach(p => {
            const d = p.val();
