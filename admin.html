<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الشركة - التحكم الشامل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --main: #1877f2; --red: #ff4757; --dark: #2f3542; }
        body { font-family: sans-serif; background: #f1f2f6; margin: 0; padding: 20px; }
        .section { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: var(--dark); border-bottom: 2px solid var(--main); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        th { background: #f8f9fa; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; color: white; }
        .btn-ban { background: var(--red); }
        .btn-unban { background: #2ed573; }
        .chat-room { background: #eef2f7; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-right: 5px solid #2ed573; }
        .msg { font-size: 14px; margin: 5px 0; border-bottom: 1px solid #ddd; }
        .sender { font-weight: bold; color: var(--main); }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 30px;">
        <h1>🛡️ لوحة تحكم شركة تواصل</h1>
    </header>

    <div class="section">
        <h2>👤 إدارة المستخدمين والحظر</h2>
        <table id="userTable">
            <thead><tr><th>المستخدم</th><th>كلمة السر</th><th>الحالة</th><th>الإجراء</th></tr></thead>
            <tbody id="usersList"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>📝 المنشورات الحالية</h2>
        <div id="postsList"></div>
    </div>

    <div class="section">
        <h2>💬 مراقبة الدردشات (جديد)</h2>
        <div id="chatsList"></div>
    </div>

<script>
    const config = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(config);
    const db = firebase.database();

    // 1. مراقبة المستخدمين
    db.ref('users').on('value', s => {
        const list = document.getElementById('usersList');
        list.innerHTML = "";
        s.forEach(u => {
            const d = u.val();
            const banned = d.status === 'banned';
            list.innerHTML += `<tr>
                <td><b>${d.name || u.key}</b></td>
                <td>${d.pass}</td>
                <td style="color:${banned?'red':'green'}">${banned?'محظور':'نشط'}</td>
                <td><button class="btn ${banned?'btn-unban':'btn-ban'}" onclick="setBan('${u.key}', ${!banned})">${banned?'تفعيل':'حظر'}</button></td>
            </tr>`;
        });
    });

    // 2. مراقبة المنشورات
    db.ref('posts').on('value', s => {
        const list = document.getElementById('postsList');
        list.innerHTML = "";
        s.forEach(p => {
            const d = p.val();
            list.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">
                <button onclick="db.ref('posts/${p.key}').remove()" style="float:left; color:red; border:none; cursor:pointer;">حذف 🗑️</button>
                <b>${d.u || d.name}:</b> ${d.t || d.text}
            </div>`;
        });
    });

    // 3. مراقبة الدردشات (قراءة الغرف الجديدة)
    db.ref('chats').on('value', s => {
        const list = document.getElementById('chatsList');
        list.innerHTML = "";
        if(!s.exists()) list.innerHTML = "لا توجد دردشات نشطة حالياً.";
        s.forEach(room => {
            let html = `<div class="chat-room"><small>غرفة: ${room.key}</small>`;
            room.forEach(msg => {
                const m = msg.val();
                html += `<div class="msg"><span class="sender">${m.sender}:</span> ${m.text}</div>`;
            });
            list.innerHTML += html + `</div>`;
        });
    });
