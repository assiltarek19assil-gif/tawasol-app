<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل - نظام الدردشة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; text-align: center; }
        .box { background: white; max-width: 450px; margin: 20px auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input { width: 85%; padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid #ddd; }
        button { padding: 10px 20px; background: #1877f2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .chat-area { height: 300px; border: 1px solid #eee; overflow-y: auto; display: flex; flex-direction: column; padding: 10px; background: #f9f9f9; margin-bottom: 10px; border-radius: 10px; }
        .msg { padding: 8px 12px; margin: 5px; border-radius: 15px; max-width: 70%; font-size: 14px; word-wrap: break-word; }
        .msg.me { background: #1877f2; color: white; align-self: flex-start; }
        .msg.him { background: #e4e6eb; color: black; align-self: flex-end; }
        .friend-btn { width: 100%; text-align: right; background: #f0f2f5; color: black; margin: 5px 0; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div id="authSection" class="box">
        <h2>تسجيل الدخول</h2>
        <input id="username" type="text" placeholder="اسم المستخدم">
        <input id="password" type="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="box">
            <h3>مرحباً <span id="myName"></span></h3>
            <p style="font-size: 12px; color: #777;">الرمز الخاص بك: <b id="myTag"></b></p>
            
            <hr>
            <h4>إضافة صديق</h4>
            <input id="friendTag" type="text" placeholder="ادخل الرمز (Tag) الخاص بصديقك">
            <button onclick="addFriend()" style="background: #28a745;">إضافة</button>
            
            <hr>
            <h4>أصدقائي</h4>
            <div id="friendsList"></div>
        </div>
    </div>

    <div id="chatSection" class="box hidden">
        <h3 id="chatWith">الدردشة</h3>
        <div id="msgBox" class="chat-area"></div>
        <div style="display:flex;">
            <input id="msgInput" type="text" placeholder="اكتب رسالة...">
            <button onclick="sendMsg()">إرسال</button>
        </div>
        <button onclick="closeChat()" style="background: #666; width: 100%; margin-top: 10px;">إغلاق</button>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myInfo = JSON.parse(localStorage.getItem('chatUser')) || null;
    let currentChatFriend = null;

    if (myInfo) startApp();

    function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        db.ref('users/' + u).once('value', s => {
            if (s.exists() && s.val().pass === p) { myInfo = s.val(); }
            else { 
                const tag = u + "_" + Math.floor(1000 + Math.random() * 8999);
                myInfo = { name: u, pass: p, tag: tag };
                db.ref('users/' + u).set(myInfo);
                db.ref('tags/' + tag).set(u);
            }
            localStorage.setItem('chatUser', JSON.stringify(myInfo));
            location.reload();
        });
    }

    function startApp() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('myName').innerText = myInfo.name;
        document.getElementById('myTag').innerText = myInfo.tag;
        loadFriends();
    }

    function addFriend() {
        const tag = document.getElementById('friendTag').value;
        db.ref('tags/' + tag).once('value', s => {
            if (s.exists()) {
                db.ref('friends/' + myInfo.tag + '/' + tag).set(s.val());
                alert("تمت إضافة " + s.val());
                document.getElementById('friendTag').value = "";
            } else { alert("الرمز غير موجود!"); }
        });
    }

    function loadFriends() {
        db.ref('friends/' + myInfo.tag).on('value', s => {
            const div = document.getElementById('friendsList');
            div.innerHTML = "";
            s.forEach(f => {
                div.innerHTML += `<button class="friend-btn" onclick="openChat('${f.key}', '${f.val()}')">💬 ${f.val()}</button>`;
            });
        });
    }

    function openChat(tag, name) {
        currentChatFriend = { tag: tag, name: name };
        document.getElementById('chatSection').classList.remove('hidden');
        document.getElementById('chatWith').innerText = "دردشة مع " + name;
        
        // إنشاء معرّف فريد للغرفة بين الصديقين
        const roomID = myInfo.tag < tag ? myInfo.tag + tag : tag + myInfo.tag;
        
        db.ref('chats/' + roomID).off(); // تنظيف المحادثة القديمة
        document.getElementById('msgBox').innerHTML = "";
        
        db.ref('chats/' + roomID).on('child_added', s => {
            const m = s.val();
            const cls = m.sender === myInfo.tag ? 'me' : 'him';
            document.getElementById('msgBox').innerHTML += `<div class="msg ${cls}">${m.text}</div>`;
            document.getElementById('msgBox').scrollTop = 9999;
        });
    }

    function sendMsg() {
        const txt = document.getElementById('msgInput').value;
        if (!txt || !currentChatFriend) return;
        const roomID = myInfo.tag < currentChatFriend.tag ? myInfo.tag + currentChatFriend.tag : currentChatFriend.tag + myInfo.tag;
        db.ref('chats/' + roomID).push({ sender: myInfo.tag, text: txt });
        document.getElementById('msgInput').value = "";
    }

    function closeChat() { document.getElementById('chatSection').classList.add('hidden'); }
</script>
</body>
</html>
