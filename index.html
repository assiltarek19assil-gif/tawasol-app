<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل - حسابي السحابي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; text-align: center; }
        .box { background: white; max-width: 400px; margin: 50px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 95%; padding: 10px; background: #1877f2; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        #postList { text-align: right; max-width: 400px; margin: auto; }
        .post { background: white; padding: 10px; margin: 10px 0; border-radius: 8px; border-right: 5px solid #1877f2; }
    </style>
</head>
<body>

    <div id="authSection" class="box">
        <h2>تسجيل الدخول</h2>
        <p>ادخل اسمك وكلمة سرك لتجد بياناتك من أي مكان</p>
        <input id="username" type="text" placeholder="اسم المستخدم">
        <input id="password" type="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول / إنشاء حساب</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="box">
            <h3 id="welcomeMsg">مرحباً</h3>
            <p id="userTag" style="color: blue;"></p>
            <textarea id="postText" style="width: 90%; height: 60px;" placeholder="اكتب شيئاً..."></textarea>
            <button onclick="sendPost()">نشر</button>
            <button onclick="logout()" style="background: #666; margin-top: 10px;">خروج</button>
        </div>
        <div id="postList"></div>
    </div>

<script>
    // ربط التطبيق بقاعدة البيانات (Firebase)
    const firebaseConfig = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;

    // فحص إذا كان المستخدم قد سجل دخوله سابقاً على هذا المتصفح
    const savedUser = localStorage.getItem('chatUser');
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        startApp();
    }

    function login() {
        const name = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (!name || !pass) return alert("من فضلك اكمل البيانات");

        db.ref('users/' + name).once('value', (s) => {
            if (s.exists()) {
                if (s.val().pass === pass) {
                    currentUser = s.val();
                    saveAndStart();
                } else { alert("كلمة المرور خاطئة!"); }
            } else {
                // إنشاء حساب جديد في السحابة
                const tag = name + "_" + Math.floor(1000 + Math.random() * 8999);
                currentUser = { name: name, pass: pass, tag: tag };
                db.ref('users/' + name).set(currentUser);
                saveAndStart();
            }
        });
    }

    function saveAndStart() {
        localStorage.setItem('chatUser', JSON.stringify(currentUser));
        startApp();
    }

    function startApp() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('welcomeMsg').innerText = "مرحباً يا " + currentUser.name;
        document.getElementById('userTag').innerText = "الرمز الخاص بك: " + currentUser.tag;
        loadPosts();
    }

    function sendPost() {
        const text = document.getElementById('postText').value;
        if (!text) return;
        db.ref('posts').push({
            user: currentUser.name,
            text: text,
            tag: currentUser.tag
        });
        document.getElementById('postText').value = "";
    }

    function loadPosts() {
        db.ref('posts').on('child_added', (s) => {
            const p = s.val();
            const html = `<div class="post"><b>${p.user}:</b> <p>${p.text}</p></div>`;
            document.getElementById('postList').insertAdjacentHTML('afterbegin', html);
        });
    }

    function logout() {
        localStorage.removeItem('chatUser');
        location.reload();
    }
</script>
</body>
</html>
