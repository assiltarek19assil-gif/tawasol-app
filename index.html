<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تواصل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --main: #1877f2; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding-bottom: 60px; }
        .header { background: var(--main); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: var(--main); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .post { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; }
        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 55px; }
        .nav-i { flex: 1; text-align: center; line-height: 55px; cursor: pointer; font-size: 22px; color: #65676b; }
        .active { color: var(--main); border-bottom: 3px solid var(--main); }
        .hidden { display: none !important; }
        .chat-win { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 1000; display: flex; flex-direction: column; }
        .msgs { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; display: flex; flex-direction: column; }
        .m { padding: 8px 12px; margin: 4px; border-radius: 15px; max-width: 75%; font-size: 14px; }
        .me { background: #dcf8c6; align-self: flex-start; }
        .him { background: white; align-self: flex-end; }
    </style>
</head>
<body>

<div id="authArea" class="container">
    <div class="card" style="margin-top: 50px; text-align: center;">
        <h2 style="color: var(--main);">دخول تواصل</h2>
        <input id="uInp" type="text" placeholder="اسم المستخدم">
        <input id="pInp" type="password" placeholder="كلمة المرور">
        <button id="loginBtn" onclick="login()">دخول الآن</button>
        <p id="statusTxt" style="font-size:12px; color:gray; margin-top:10px;">بانتظار إدخال البيانات...</p>
    </div>
</div>

<div id="appArea" class="hidden">
    <div class="header">منصة تواصل</div>
    <div class="container">
        <div id="p-home" class="page">
            <div class="card"><textarea id="pTxt" placeholder="بماذا تفكر؟"></textarea><button onclick="post()">نشر</button></div>
