<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Lite</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{margin:0;font-family:Tahoma;background:#eef2f5}
.header{background:#1877f2;color:#fff;padding:14px;text-align:center;font-weight:bold;position:sticky;top:0}
.container{max-width:650px;margin:auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
button{background:#1877f2;color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer}
button:active{transform:scale(.97)}
.hidden{display:none}
.uimg{width:45px;height:45px;border-radius:50%;object-fit:cover}

.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex}
.nav div{flex:1;text-align:center;padding:12px;font-size:22px;cursor:pointer}

.msg{padding:8px 10px;border-radius:12px;margin:4px;max-width:70%}
.me{background:#1877f2;color:white;margin-right:auto}
.him{background:#e4e6eb;margin-left:auto}

#chatBox{
position:fixed;
bottom:0;
left:0;
right:0;
height:420px;
background:white;
display:none;
flex-direction:column;
box-shadow:0 -5px 25px rgba(0,0,0,.3);
z-index:9999;
}

#notif{
position:fixed;
top:15px;
left:15px;
background:#1877f2;
color:white;
padding:10px 14px;
border-radius:12px;
display:none;
z-index:99999
}

.onlineDot{color:#2ecc71;margin-left:6px}
</style>
</head>

<body>

<div id="notif"></div>

<div id="loginPage" class="container">
<div class="card">
<h2>تسجيل الدخول</h2>
<input id="username" placeholder="اسم المستخدم">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
</div>
</div>

<div id="app" class="hidden">
<div class="header">منصتي الاجتماعية</div>
<div class="container">

<div class="card" style="text-align:center">
<img id="avatar" src="https://via.placeholder.com/100" style="width:100px;height:100px;border-radius:50%">
<input id="avatarUrl" placeholder="رابط صورتك">
<button onclick="saveAvatar()">تحديث الصورة</button>
<h3 id="myName"></h3>
</div>

<div class="card">
<textarea id="postText" placeholder="اكتب منشور..."></textarea>
<button onclick="addPost()">نشر</button>
</div>

<div id="posts"></div>

<div class="card">
<h3>إضافة صديق</h3>
<input id="friendName" placeholder="اسم المستخدم">
<button onclick="sendRequest()">إرسال طلب</button>
</div>

<div id="requests"></div>
<div id="friends"></div>

</div>

<div class="nav">
<div onclick="scrollTo(0,0)">🏠</div>
<div onclick="document.getElementById('friends').scrollIntoView()">💬</div>
</div>
</div>

<div id="chatBox">
<div style="background:#1877f2;color:white;padding:10px;display:flex;justify-content:space-between">
<span id="chatUser"></span>
<span id="closeChat" style="cursor:pointer;font-size:20px">✖</span>
</div>
<div id="messages" style="flex:1;overflow:auto;padding:10px;background:#f0f2f5"></div>
<div style="display:flex">
<input id="msgInput" placeholder="اكتب رسالة">
<button onclick="sendMsg()">إرسال</button>
</div>
</div>

<script>
const config={databaseURL:"PUT_YOUR_DATABASE_URL"};
firebase.initializeApp(config);
const db=firebase.database();

let me=null;
let activeChat=null;
let chatListener=null;
let postsListener=null;
let friendsListener=null;
let requestsListener=null;

function notify(t){
const notifEl = document.getElementById("notif");
if(notifEl) {
notifEl.innerText=t;
notifEl.style.display="block";
setTimeout(()=>notifEl.style.display="none",3000);
}
}

function login(){
const usernameEl = document.getElementById("username");
const passwordEl = document.getElementById("password");
if(!usernameEl || !passwordEl) return alert("خطأ في الصفحة");

const u=usernameEl.value.trim();
const p=passwordEl.value.trim();
if(!u||!p)return alert("أدخل البيانات");

db.ref("users/"+u).once("value",s=>{
let d=s.val();
if(d && d.pass!==p) return alert("كلمة المرور خاطئة");

me=d||{name:u,pass:p,avatar:""};
db.ref("users/"+u).set(me);
localStorage.setItem("me",JSON.stringify(me));
start();
});
}

function start(){
me=JSON.parse(localStorage.getItem("me"));
if(!me)return;

const loginPageEl = document.getElementById("loginPage");
const appEl = document.getElementById("app");
const myNameEl = document.getElementById("myName");
const avatarEl = document.getElementById("avatar");

if(loginPageEl) loginPageEl.classList.add("hidden");
if(appEl) appEl.classList.remove("hidden");

if(myNameEl) myNameEl.innerText=me.name;
if(avatarEl) avatarEl.src=me.avatar||avatarEl.src;

const status=db.ref("users/"+me.name+"/online");
db.ref(".info/connected").on("value",snap=>{
if(snap.val()===true){
status.onDisconnect().set(false);
status.set(true);
}
});

loadPosts();
loadFriends();
loadRequests();
}

start();

function saveAvatar(){
const avatarUrlEl = document.getElementById("avatarUrl");
const avatarEl = document.getElementById("avatar");
if(!avatarUrlEl || !avatarEl) return;

me.avatar=avatarUrlEl.value;
db.ref("users/"+me.name+"/avatar").set(me.avatar);
localStorage.setItem("me",JSON.stringify(me));
avatarEl.src=me.avatar;
}

function addPost(){
const postTextEl = document.getElementById("postText");
if(!postTextEl) return;

const t=postTextEl.value.trim();
if(!t)return;
db.ref("posts").push({u:me.name,t:t,a:me.avatar});
postTextEl.value="";
}

function loadPosts(){
const postsEl = document.getElementById("posts");
if(!postsEl) return;

if(postsListener) db.ref("posts").off("child_added",postsListener);

postsListener = (s)=>{
const d=s.val();
postsEl.insertAdjacentHTML("afterbegin",`
<div class="card">
<div style="display:flex;gap:10px">
<img src="${d.a||'https://via.placeholder.com/45'}" class="uimg">
<b>${d.u}</b>
</div>
<p>${d.t}</p>

<button onclick="likePost('${s.key}')">👍 إعجاب</button>
<span id="likes_${s.key}">0</span>

<div id="comments_${s.key}"></div>
<input id="cinput_${s.key}" placeholder="تعليق...">
<button onclick="commentPost('${s.key}')">إرسال</button>
</div>`);

loadLikes(s.key);
loadComments(s.key);
};

db.ref("posts").on("child_added",postsListener);
}

function likePost(id){
const ref=db.ref("likes/"+id+"/"+me.name);
ref.once("value",s=>{s.exists()?ref.remove():ref.set(true);});
}

function loadLikes(id){
db.ref("likes/"+id).on("value",s=>{
const likesEl = document.getElementById("likes_"+id);
if(likesEl) likesEl.innerText=s.numChildren()+" إعجاب";
});
}

function commentPost(id){
const cinputEl = document.getElementById("cinput_"+id);
if(!cinputEl) return;

const txt=cinputEl.value.trim();
if(!txt)return;
db.ref("comments/"+id).push({u:me.name,t:txt});
cinputEl.value="";
}

function loadComments(id){
db.ref("comments/"+id).on("child_added",s=>{
const d=s.val();
const commentsEl = document.getElementById(`comments_${id}`);
if(commentsEl) {
commentsEl.insertAdjacentHTML("beforeend",
`<div style="background:#f1f5f9;padding:6px;border-radius:8px;margin:4px 0">
<b>${d.u}:</b> ${d.t}</div>`);
}
});
}

function sendRequest(){
const friendNameEl = document.getElementById("friendName");
if(!friendNameEl) return;

const f=friendNameEl.value.trim();
if(!f)return;
db.ref("requests/"+f+"/"+me.name).set(true);
notify("تم إرسال الطلب");
friendNameEl.value="";
}

function loadRequests(){
const requestsEl = document.getElementById("requests");
if(!requestsEl) return;

if(requestsListener) db.ref("requests/"+me.name).off("child_added",requestsListener);

requestsListener = (s)=>{
notify("طلب صداقة جديد 👥");
requestsEl.insertAdjacentHTML("beforeend",
`<div class="card">${s.key}
<button onclick="accept('${s.key}')">قبول</button></div>`);
};

db.ref("requests/"+me.name).on("child_added",requestsListener);
}

function accept(n){
db.ref("friends/"+me.name+"/"+n).set(true);
db.ref("friends/"+n+"/"+me.name).set(true);
db.ref("requests/"+me.name+"/"+n).remove();
}

function loadFriends(){
const friendsEl = document.getElementById("friends");
if(!friendsEl) return;

friendsEl.innerHTML="";

if(friendsListener) db.ref("friends/"+me.name).off("child_added",friendsListener);

friendsListener = (s)=>{
friendsEl.insertAdjacentHTML("beforeend",
`<div class="card" onclick="openChat('${s.key}')">🟢 ${s.key}</div>`);
};

db.ref("friends/"+me.name).on("child_added",friendsListener);
}

function openChat(user){
const chatBoxEl = document.getElementById("chatBox");
const chatUserEl = document.getElementById("chatUser");
const messagesEl = document.getElementById("messages");

if(!chatBoxEl || !chatUserEl || !messagesEl) return;

chatBoxEl.style.display="flex";
chatUserEl.innerText=user;
activeChat=[me.name,user].sort().join("_");
messagesEl.innerHTML="";

if(chatListener) db.ref("chats/"+activeChat).off("child_added",chatListener);

chatListener=(s)=>{
const d=s.val();
const cls=d.s===me.name?"me":"him";
if(d.s!==me.name) notify("رسالة جديدة 💬");
messagesEl.insertAdjacentHTML("beforeend",`<div class="msg ${cls}">${d.t}</div>`);
messagesEl.scrollTop=messagesEl.scrollHeight;
};

db.ref("chats/"+activeChat).on("child_added",chatListener);
}

function sendMsg(){
const msgInputEl = document.getElementById("msgInput");
if(!msgInputEl) return;

const t=msgInputEl.value.trim();
if(!t)return;
db.ref("chats/"+activeChat).push({s:me.name,t:t});
msgInputEl.value="";
}

const closeChatEl = document.getElementById("closeChat");
if(closeChatEl) {
closeChatEl.onclick=()=>{
const chatBoxEl = document.getElementById("chatBox");
if(chatBoxEl) chatBoxEl.style.display="none";
if(chatListener) db.ref("chats/"+activeChat).off("child_added",chatListener);
};
}
</script>
</body>
</html>
