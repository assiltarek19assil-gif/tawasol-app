<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل - نظام الأصدقاء المطور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 65px; }
        .header { background: #1877f2; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; font-weight: bold; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; background: #f5f6f7; }
        button { background: #1877f2; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        
        /* المنشورات */
        .post { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; }
        .like-btn { background: #f0f2f5; color: #65676b; width: auto; padding: 5px 15px; margin-top: 10px; border-radius: 5px; }
        .liked { color: #1877f2; font-weight: bold; }

        /* قائمة الأصدقاء والطلبات */
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; background: #fff; margin-bottom: 5px; border-radius: 8px; }
        .chat-btn { background: #2ed573; color: white; padding: 5px 12px; border-radius: 6px; font-size: 13px; text-decoration: none; cursor: pointer; }
        .acc-btn { background: #1877f2; color: white; padding: 5px 12px; border-radius: 6px; }

        /* نافذة الدردشة */
        .chat-win { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 1000; display: flex; flex-direction: column; }
        .chat-head { background: #1877f2; color: white; padding: 15px; display: flex; justify-content: space-between; font-weight: bold; }
        .msgs { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; display: flex; flex-direction: column; }
        .m { padding: 9px 14px; margin: 5px; border-radius: 18px; max-width: 75%; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .me { background: #dcf8c6; align-self: flex-start; border-top-left-radius: 0; }
        .him { background: white; align-self: flex-end; border-top-right-radius: 0; }
