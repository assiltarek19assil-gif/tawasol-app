<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل برو - التفاعلات</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; }
        .box { background: white; max-width: 500px; margin: 15px auto; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, textarea { width: 92%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* تصميم المنشور المطور */
        .post { text-align: right; position: relative; }
        .post img { width: 100%; border-radius: 8px; margin-top: 10px; }
        .actions { display: flex; gap: 20px; border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px; }
        .like-btn { color: #65676b; cursor: pointer; font-size: 14px; }
        .like-btn.active { color: var(--primary); }
        
        /* شريط التنقل السفلي */
        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; padding: 10px 0; z-index: 1000; }
        .nav div { flex: 1; text-align: center; cursor: pointer; color: #666; }
        .active-tab { color: var(--primary) !important; font-weight: bold; }
    </style>
</head>
<body>

    <div id="authPage" class="box" style="margin-top: 50px;">
        <h2>تسجيل الدخول</h2>
        <input id="uInp" type="text" placeholder="الاسم">
        <input id="pInp" type="password" placeholder="كلمة المرور">
        <button onclick="auth()" style="width:100%">دخول</button>
    </div>

    <div id="app" class="hidden">
        <div id="p-home" class="page">
            <div class="box">
                <textarea id="postTxt" placeholder="بماذا تفكر؟"></textarea>
                <input id="postImg" type="text" placeholder="رابط صورة (اختياري)">
                <button onclick="sendPost()" style="width:100%">نشر</button>
            </div>
            <div id="feed"></div>
        </div>

        <div id="p-friends" class="page hidden">
            <div class="box">
                <h4>إضافة صديق</h4>
                <input id="sTag" type="text" placeholder="الرمز (Tag)">
                <button onclick="addF()" style="width:100%; background:#28a745">إضافة</button>
            </div>
            <div id="fList"></div>
        </div>

        <div id="p-me" class="page hidden">
            <div class="box">
                <h3>حسابي</h3>
                <p id="myData"></p>
                <button onclick="logout()" style="background:#666">خروج</button>
            </div>
        </div>

        <div class="nav">
            <div id="n-home" class="active-tab" onclick="tab('home')">🏠 الرئيسية</div>
            <div id="n-friends" onclick="tab('friends')">👥 الأصدقاء</div>
            <div id="n-me" onclick="tab('me')">⚙️ حسابي</div>
        </div>
    </div>

<script>
    const conf = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(conf);
    const db = firebase.database();

    let user = JSON.parse(localStorage.getItem('user'));

    function auth() {
        const u = document.getElementById('uInp').value;
        const p = document.getElementById('pInp').value;
        db.ref('users/'+u).once('value', s => {
            if(s.exists() && s.val().pass === p) { user = s.val(); }
            else {
                const t = u + "_" + Math.floor(1000+Math.random()*9000);
                user = { name:u, pass:p, tag:t };
                db.ref('users/'+u).set(user);
                db.ref('tags/'+t).set(u);
            }
            localStorage.setItem('user', JSON.stringify(user));
            location.reload();
        });
    }

    if(user) {
        document.getElementById('authPage').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('myData').innerText = `الاسم: ${user.name} | الرمز: ${user.tag}`;
        loadPosts();
    }

    function tab(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById('p-'+n).classList.remove('hidden');
        document.querySelectorAll('.nav div').forEach(d => d.classList.remove('active-tab'));
        document.getElementById('n-'+n).classList.add('active-tab');
    }

    function sendPost() {
        const txt = document.getElementById('postTxt').value;
        const img = document.getElementById('postImg').value;
        if(txt || img) {
            db.ref('posts').push({
                u: user.name,
                tag: user.tag,
                t: txt,
                img: img,
                likes: 0
            });
        }
        document.getElementById('postTxt').value = "";
        document.getElementById('postImg').value = "";
    }

    function loadPosts() {
        db.ref('posts').on('value', s => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            s.forEach(p => {
                const data = p.val();
                const id = p.key;
                let postHTML = `
                    <div class="box post">
                        <b>${data.u}</b> <small>@${data.tag}</small>
                        <p>${data.t}</p>
                        ${data.img ? `<img src="${data.img}">` : ''}
                        <div class="actions">
                            <span class="like-btn" onclick="likePost('${id}', ${data.likes})">👍 إعجاب (${data.likes || 0})</span>
                            <span class="like-btn" onclick="alert('قريباً: التعليقات قيد التطوير')">💬 تعليق</span>
                        </div>
                    </div>`;
                feed.insertAdjacentHTML('afterbegin', postHTML);
            });
        });
    }

    function likePost(id, currentLikes) {
        db.ref('posts/' + id + '/likes').set((currentLikes || 0) + 1);
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
