<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل - اختبار الاتصال</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body style="text-align:center; font-family:sans-serif; background:#f0f2f5; padding:50px;">

    <div id="loading">جاري تحميل المنصة...</div>

    <div id="main" style="display:none;">
        <h1 style="color:#1877f2">مرحباً بك في تواصل!</h1>
        <p>إذا ظهرت هذه الرسالة، فالموقع يعمل بنجاح.</p>
        <button onclick="localStorage.clear(); location.reload();">إعادة تعيين الدخول</button>
    </div>

    <script>
        const config = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(config);
        
        // اختبار بسيط للاتصال
        firebase.database().ref('.info/connected').on('value', (s) => {
            if (s.val() === true) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main').style.display = 'block';
            } else {
                document.getElementById('loading').innerText = "فشل الاتصال بقاعدة البيانات.. تأكد من الرابط.";
            }
        });
    </script>
</body>
</html>
