<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل - النسخة الآمنة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; }
        .box { background: white; max-width: 500px; margin: 15px auto; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, textarea { width: 92%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; padding: 10px 0; }
        .nav div { flex: 1; text-align: center; cursor: pointer; color: #666; font-size: 13px; }
        .active { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div id="authPage" class="box" style="margin-top: 50px;">
        <h2>تسجيل الدخول</h2>
        <input id="uInp" type="text" placeholder="الاسم">
        <input id="pInp" type="password" placeholder="كلمة المرور">
        <button onclick="auth()">دخول</button>
    </div>

    <div id="mainApp" class="hidden">
        <div id="p-home" class="page">
            <div class="box">
                <textarea id="postTxt" placeholder="بماذا تفكر؟"></textarea>
                <button onclick="sendPost()">نشر</button>
            </div>
            <div id="feed"></div>
        </div>

        <div id="p-me" class="page hidden">
            <div class="box">
                <h3>حسابي</h3>
                <p id="m-info"></p>
                <button onclick="logout()" style="background:#666">خروج</button>
            </div>
        </div>

        <div class="nav">
            <div id="n-home" class="active" onclick="tab('home')">🏠 الرئيسية</div>
            <div id="n-me" onclick="tab('me')">⚙️ حسابي</div>
        </div>
    </div>

<script>
    const conf = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(conf);
    const db = firebase.database();

    let me = JSON.parse(localStorage.getItem('user'));

    // دالة الدخول مع فحص الحظر
    function auth() {
        const u = document.getElementById('uInp').value;
        const p = document.getElementById('pInp').value;
        db.ref('users/'+u).once('value', s => {
            if(s.exists()){
                const userData = s.val();
                if(userData.status === 'banned') return alert("❌ هذا الحساب مغلق من قبل الإدارة");
                if(userData.pass === p) { me = userData; loginSuccess(); }
                else alert("كلمة السر خطأ");
            } else {
                const t = u + "_" + Math.floor(1000+Math.random()*9000);
                me = { name:u, pass:p, tag:t, status:'active' };
                db.ref('users/'+u).set(me);
                loginSuccess();
            }
        });
    }

    function loginSuccess() {
        localStorage.setItem('user', JSON.stringify(me));
        location.reload();
    }

    // --- ميزة الرقابة اللحظية (الشرطي البرمجي) ---
    if(me) {
        db.ref('users/' + me.name + '/status').on('value', s => {
            if(s.val() === 'banned') {
                alert("🛑 تم إغلاق حسابك الآن من قبل الشركة!");
                logout();
            } else {
                document.getElementById('authPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('m-info').innerText = `الاسم: ${me.name} | الرمز: ${me.tag}`;
                loadPosts();
            }
        });
    }

    function tab(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById('p-'+n).classList.remove('hidden');
    }

    function sendPost() {
        const t = document.getElementById('postTxt').value;
        if(t) db.ref('posts').push({ u:me.name, t:t });
        document.getElementById('postTxt').value = "";
    }

    function loadPosts() {
        db.ref('posts').on('child_added', s => {
            const d = s.val();
            document.getElementById('feed').insertAdjacentHTML('afterbegin', `<div class="box"><b>${d.u}</b>: ${d.t}</div>`);
        });
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
