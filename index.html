<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل - اختبار نهائي</title>
</head>
<body style="background: #1877f2; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif;">

    <h1 id="status">جاري تشغيل المنصة...</h1>
    <div id="box" style="background: white; color: black; padding: 20px; border-radius: 15px; display: none; width: 80%; max-width: 400px; text-align: center;">
        <h2>مرحباً بك! 👋</h2>
        <p>إذا رأيت هذا المربع الأبيض، فالموقع يعمل الآن.</p>
        <button onclick="location.reload()" style="padding: 10px 20px; background: #1877f2; color: white; border: none; border-radius: 5px; cursor: pointer;">تحديث الصفحة</button>
    </div>

    <script>
        // هذا السطر سيتأكد من تشغيل الموقع بعد ثانية واحدة
        setTimeout(() => {
            document.getElementById('status').innerText = "✅ تم التحميل بنجاح!";
            document.getElementById('box').style.display = 'block';
        }, 1000);
    </script>
</body>
</html>
