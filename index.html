<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل - النسخة الاجتماعية</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 65px; }
        .header { background: #1877f2; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; font-weight: bold; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; background: #f5f6f7; }
        button { background: #1877f2; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 5px; }
        
        /* المنشورات والإعجاب */
        .post { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; position: relative; }
        .post-user { color: #1c1e21; font-weight: bold; }
        .like-section { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; display: flex; align-items: center; gap: 10px; }
        .like-btn { background: #f0f2f5; color: #65676b; width: auto; padding: 5px 15px; }
        .liked { color: #1877f2; }

        /* الأصدقاء */
        .req-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-sm { width: auto; padding: 5px 10px; font-size: 12px; }

        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 55px; }
        .nav-item { flex: 1; text-align: center; line-height: 55px; cursor: pointer; color: #65676b; font-weight: bold; }
        .active { color: #1877f2; border-bottom: 3px solid #1877f2; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="authArea" class="container">
    <div class="card" style="margin-top: 50px; text-align: center;">
        <h2 style="color: #1877f2;">دخول تواصل</h2>
        <input id="uInp" type="text" placeholder="الاسم">
        <input id="pInp" type="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول سريع</button>
    </div>
</div>

<div id="appArea" class="hidden">
    <div class="header">منصة تواصل</div>
    <div class="container">
        <div id="p-home" class="page">
            <div class="card"><textarea id="pTxt" placeholder="ماذا يدور في ذهنك؟"></textarea><button onclick="post()">نشر</button></div>
            <div id="feed"></div>
        </div>

        <div id="p-friends" class="page hidden">
            <div class="card">
                <h3>إضافة صديق</h3>
                <input id="friendInp" type="text" placeholder="اسم المستخدم">
                <button onclick="sendRequest()">إرسال طلب</button>
            </div>
            <div class="card">
                <h3>طلبات الصداقة</h3>
                <div id="requestsList">لا توجد طلبات.</div>
            </div>
        </div>

        <div id="p-me" class="page hidden">
            <div class="card" style="text-align: center;">
                <h3 id="uNameDisp"></h3>
                <p id="uTagDisp" style="color: #1877f2;"></p>
                <button onclick="logout()" style="background: #e4e6eb; color: #050505;">خروج</button>
            </div>
        </div>
    </div>

    <div class="nav-bottom">
        <div class="nav-item active" onclick="tab('home')">🏠</div>
        <div class="nav-item" onclick="tab('friends')">👥</div>
        <div class="nav-item" onclick="tab('me')">⚙️</div>
    </div>
</div>

<script>
    const config = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(config);
    const db = firebase.database();
    let user = JSON.parse(localStorage.getItem('app_user'));

    function login() {
        const u = document.getElementById('uInp').value;
        const p = document.getElementById('pInp').value;
        if(!u || !p) return;
        db.ref('users/'+u).once('value', s => {
            const d = s.val();
            if(d && d.status === 'banned') return alert("❌ محظور");
            if(d && d.pass !== p) return alert("❌ كلمة سر خطأ");
            user = d || { name: u, pass: p, status: 'active', tag: u+"#"+Math.floor(1000+Math.random()*9000) };
            if(!d) db.ref('users/'+u).set(user);
            localStorage.setItem('app_user', JSON.stringify(user));
            location.reload();
        });
    }

    if(user) {
        document.getElementById('authArea').classList.add('hidden');
        document.getElementById('appArea').classList.remove('hidden');
        document.getElementById('uNameDisp').innerText = user.name;
        document.getElementById('uTagDisp').innerText = user.tag;
        loadPosts();
        loadRequests();
    }

    function tab(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById('p-'+n).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    // --- نظام المنشورات والإعجاب ---
    function post() {
        const t = document.getElementById('pTxt').value;
        if(t) db.ref('posts').push({ u: user.name, t: t, likes: 0 });
        document.getElementById('pTxt').value = "";
    }

    function loadPosts() {
        db.ref('posts').on('value', s => {
            const feed = document.getElementById('feed'); feed.innerHTML = "";
            s.forEach(p => {
                const d = p.val();
                const postID = p.key;
                const likedByMe = d.likedBy && d.likedBy[user.name];
                feed.insertAdjacentHTML('afterbegin', `
                    <div class="post">
                        <span class="post-user">${d.u}</span><br>${d.t}
                        <div class="like-section">
                            <button class="like-btn ${likedByMe?'liked':''}" onclick="toggleLike('${postID}')">👍 ${d.likes || 0}</button>
                        </div>
                    </div>`);
            });
        });
    }

    function toggleLike(id) {
        const postRef = db.ref('posts/'+id);
        postRef.transaction(p => {
            if(p) {
                if(!p.likedBy) p.likedBy = {};
                if(p.likedBy[user.name]) { p.likes--; delete p.likedBy[user.name]; }
                else { p.likes = (p.likes || 0) + 1; p.likedBy[user.name] = true; }
            }
            return p;
        });
    }

    // --- نظام الأصدقاء ---
    function sendRequest() {
        const target = document.getElementById('friendInp').value;
        if(target && target !== user.name) {
            db.ref('requests/'+target+'/'+user.name).set({ from: user.name });
            alert("تم إرسال الطلب لـ " + target);
        }
    }

    function loadRequests() {
        db.ref('requests/'+user.name).on('value', s => {
            const list = document.getElementById('requestsList'); list.innerHTML = "";
            if(!s.exists()) { list.innerHTML = "لا توجد طلبات."; return; }
            s.forEach(r => {
                list.innerHTML += `<div class="req-item">
                    <span>${r.key}</span>
                    <button class="btn-sm" onclick="acceptFriend('${r.key}')">قبول ✅</button>
                </div>`;
            });
        });
    }

    function acceptFriend(name) {
        db.ref('users/'+user.name+'/friends/'+name).set(true);
        db.ref('users/'+name+'/friends/'+user.name).set(true);
        db.ref('requests/'+user.name+'/'+name).remove();
        alert("أصبحتم أصدقاء الآن!");
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
