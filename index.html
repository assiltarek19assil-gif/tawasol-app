<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 60px; }
        .header { background: #1877f2; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #1877f2; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 55px; }
        .nav-i { flex: 1; text-align: center; line-height: 55px; cursor: pointer; font-size: 20px; color: #65676b; }
        .active { color: #1877f2; border-bottom: 3px solid #1877f2; }
        .hidden { display: none !important; }
        .post { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #ddd; }
        .chat-win { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 1000; display: flex; flex-direction: column; }
        .msgs { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; display: flex; flex-direction: column; }
        .m { padding: 10px; margin: 5px; border-radius: 10px; max-width: 80%; }
        .me { background: #dcf8c6; align-self: flex-start; }
        .him { background: white; align-self: flex-end; }
    </style>
</head>
<body>

<div id="auth" class="container">
    <div class="card" style="margin-top:50px; text-align:center;">
        <h2 style="color:#1877f2">دخول تواصل</h2>
        <input id="uI" placeholder="الاسم">
        <input id="pI" type="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
    </div>
</div>

<div id="app" class="hidden">
    <div class="header">منصة تواصل</div>
    <div class="container">
        <div id="p-home" class="page">
            <div class="card"><textarea id="pT" placeholder="بماذا تفكر؟"></textarea><button onclick="post()">نشر</button></div>
            <div id="feed"></div>
        </div>
        <div id="p-friends" class="page hidden">
            <div class="card"><input id="fI" placeholder="اسم الصديق"><button onclick="sendReq()">طلب صداقة</button></div>
            <div class="card"><h4>طلبات</h4><div id="reqs"></div></div>
            <div class="card"><h4>أصدقائي</h4><div id="flist"></div></div>
        </div>
        <div id="p-me" class="page hidden">
            <div class="card" style="text-align:center;"><h3 id="un"></h3><button onclick="logout()">خروج</button></div>
        </div>
    </div>
    <div class="nav">
        <div class="nav-i active" onclick="tab('home')">🏠</div>
        <div class="nav-i" onclick="tab('friends')">👥</div>
        <div class="nav-i" onclick="tab('me')">⚙️</div>
    </div>
</div>

<div id="cw" class="chat-win hidden">
    <div style="background:#1877f2; color:white; padding:15px; display:flex; justify-content:space-between;">
        <span id="ct"></span><span onclick="closeC()">✖</span>
    </div>
    <div id="mb" class="msgs"></div>
    <div style="padding:10px; display:flex; gap:5px;"><input id="mi" style="margin:0"><button onclick="sendM()" style="width:70px">إرسال</button></div>
</div>

<script>
    const config = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(config);
    const db = firebase.database();
    let user = JSON.parse(localStorage.getItem('app_user'));
    let ac = "";

    function login() {
        const u = document.getElementById('uI').value, p = document.getElementById('pI').value;
        if(!u || !p) return;
        db.ref('users/'+u).once('value', s => {
            const d = s.val();
            if(d && d.status==='banned') return alert("محظور");
            user = d || { name:u, pass:p, status:'active' };
            if(!d) db.ref('users/'+u).set(user);
            localStorage.setItem('app_user', JSON.stringify(user));
            location.reload();
        });
    }

    if(user) {
        document.getElementById('auth').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('un').innerText = user.name;
        loadP(); loadR(); loadF();
    }

    function tab(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById('p-'+n).classList.remove('hidden');
        document.querySelectorAll('.nav-i').forEach(i => i.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function post() {
        const t = document.getElementById('pT').value;
        if(t) db.ref('posts').push({ u:user.name, t:t });
        document.getElementById('pT').value = "";
    }

    function loadP() {
        db.ref('posts').on('value', s => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            s.forEach(p => { f.insertAdjacentHTML('afterbegin', `<div class="post"><b>${p.val().u}</b><br>${p.val().t}</div>`); });
        });
    }

    function sendReq() {
        const t = document.getElementById('fI').value;
        if(t && t!==user.name) { db.ref('requests/'+t+'/'+user.name).set({from:user.name}); alert("تم الإرسال"); }
    }

    function loadR() {
        db.ref('requests/'+user.name).on('value', s => {
            const l = document.getElementById('reqs'); l.innerHTML = "";
            s.forEach(r => { l.innerHTML += `<div>${r.key} <button onclick="accF('${r.key}')">قبول</button></div>`; });
        });
    }

    function accF(n) {
        db.ref('users/'+user.name+'/friends/'+n).set(true);
        db.ref('users/'+n+'/friends/'+user.name).set(true);
        db.ref('requests/'+user.name+'/'+n).remove();
    }

    function loadF() {
        db.ref('users/'+user.name+'/friends').on('value', s => {
            const l = document.getElementById('flist'); l.innerHTML = "";
            s.forEach(f => { l.innerHTML += `<div>👤 ${f.key} <button onclick="openC('${f.key}')">دردشة</button></div>`; });
        });
    }

    function openC(t) {
        ac = t; document.getElementById('cw').classList.remove('hidden');
        document.getElementById('ct').innerText = t;
        const r = user.name < t ? user.name+"_"+t : t+"_"+user.name;
        db.ref('chats/'+r).on('value', s => {
            const b = document.getElementById('mb'); b.innerHTML = "";
            s.forEach(m => { b.innerHTML += `<div class="m ${m.val().s===user.name?'me':'him'}">${m.val().t}</div>`; });
            b.scrollTop = b.scrollHeight;
        });
    }

    function sendM() {
        const t = document.getElementById('mi').value; if(!t) return;
        const r = user.name < ac ? user.name+"_"+ac : ac+"_"+user.name;
        db.ref('chats/'+r).push({ s:user.name, t:t }); document.getElementById('mi').value = "";
    }

    function closeC() { document.getElementById('cw').classList.add('hidden'); }
    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
