<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة تواصل Pro</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root { --main:#1877f2; --bg:#f0f2f5; }
body{margin:0;background:var(--bg);font-family:Segoe UI}
.header{background:var(--main);color:#fff;padding:15px;text-align:center;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.container{max-width:600px;margin:auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.btn{background:var(--main);color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;width:100%}
.post-img{width:100%;border-radius:8px;margin-top:10px;max-height:400px;object-fit:contain}
.hidden{display:none}
.nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;border-top:1px solid #ddd;height:60px}
.nav-i{flex:1;text-align:center;line-height:60px;font-size:22px;cursor:pointer}
.chat-pop{position:fixed;bottom:65px;left:10px;right:10px;max-width:380px;height:450px;background:#fff;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.2);display:flex;flex-direction:column}
.m-area{flex:1;overflow-y:auto;padding:10px;background:#f9f9f9}
.msg{padding:8px 12px;margin:4px;border-radius:15px;max-width:75%}
.m-me{align-self:flex-start;background:#dcf8c6}
.m-him{align-self:flex-end;background:#fff;border:1px solid #eee}
</style>
</head>

<body>

<div id="auth" class="container">
<div class="card" style="margin-top:60px;text-align:center">
<h2>تواصل Pro</h2>
<input id="uInp" placeholder="اسم المستخدم">
<input id="pInp" type="password" placeholder="كلمة المرور">
<button class="btn" onclick="login()">دخول / إنشاء حساب</button>
</div>
</div>

<div id="app" class="hidden">
<!-- الهيدر مع جرس الإشعارات -->
<div class="header">
    <span>منصة تواصل</span>
    <span onclick="openNotifs()" style="cursor:pointer;font-size:22px">
        🔔 <span id="notifCount" style="background:red;border-radius:50%;padding:2px 6px;font-size:12px">0</span>
    </span>
</div>

<div class="container">
    <div id="p-home" class="page">
        <div class="card">
            <textarea id="pTxt" placeholder="بماذا تفكر؟"></textarea>
            <input id="pImgUrl" placeholder="رابط صورة للمنشور (اختياري)">
            <button class="btn" onclick="post()">نشر</button>
        </div>
        <div id="feed"></div>
    </div>

    <div id="p-friends" class="page hidden">
        <div class="card">
            <h3>👥 إضافة صديق</h3>
            <input id="friendTagI" placeholder="الاسم#0000">
            <button class="btn" onclick="addFriend()">إرسال طلب</button>
        </div>
        <div id="reqsArea"></div>
        <div id="friendsList"></div>
    </div>

    <div id="p-me" class="page hidden">
        <div class="card" style="text-align:center;">
            <img id="myAvatarDisplay" class="u-img" style="width:100px;height:100px;border:3px solid var(--main);margin-bottom:10px;">
            <h3 id="userNameDisplay" style="margin:5px 0;"></h3>
            <span id="userTagDisplay" class="user-tag"></span>
            <hr>
            <input id="avatarUrlInput" placeholder="ضع رابط صورتك الشخصية هنا">
            <button class="btn" onclick="updateAvatar()">تحديث صورة البروفايل</button>
            <button class="btn" style="background:#ff4757;margin-top:20px;" onclick="logout()">خروج</button>
        </div>
    </div>
</div>

<div class="nav">
    <div class="nav-i" onclick="tab('home')">🏠</div>
    <div class="nav-i" onclick="tab('friends')">👥</div>
    <div class="nav-i" onclick="tab('me')">⚙️</div>
</div>
</div>

<!-- صندوق الدردشة -->
<div id="chatBox" class="chat-pop hidden">
    <div style="background:var(--main);color:white;padding:12px;display:flex;justify-content:space-between;">
        <b id="chatTitle">الدردشة</b> <span onclick="closeChat()" style="cursor:pointer">✕</span>
    </div>
    <div id="msgsDisplay" class="m-area"></div>
    <div style="padding:10px;display:flex;background:white;">
        <input id="msgInput" style="margin:0;flex:1;" placeholder="اكتب...">
        <button class="btn" style="width:50px;margin-right:5px;" onclick="sendMsg()">↗</button>
    </div>
</div>

<!-- صندوق الإشعارات -->
<div id="notifBox" class="chat-pop hidden">
    <div style="background:var(--main);color:white;padding:12px;display:flex;justify-content:space-between;">
        <b>الإشعارات</b>
        <span onclick="closeNotifs()" style="cursor:pointer">✕</span>
    </div>
    <div id="notifList" class="m-area"></div>
</div>

<script>
const config = { databaseURL: "https://mychatapp-d7580-default-rtdb.firebaseio.com/" };
if(!firebase.apps.length) firebase.initializeApp(config);
const db = firebase.database();

let user = JSON.parse(localStorage.getItem('app_user'));
let activeChat = "";

// دالة تسجيل الدخول / إنشاء حساب
function login(){
    const u = uInp.value.trim();
    const p = pInp.value.trim();
    if(!u || !p) return alert("أكمل البيانات");
    db.ref('users/'+u).once('value', s=>{
        let d = s.val();
        if(d && d.pass!==p) return alert("كلمة المرور خاطئة!");
        if(!d){
            d = { name:u, pass:p, tag:u+"#"+Math.floor(1000+Math.random()*9000), avatar:"", status:"active" };
            db.ref('users/'+u).set(d);
        }
        user=d;
        localStorage.setItem('app_user', JSON.stringify(d));
        location.reload();
    });
}

// تفعيل واجهة التطبيق إذا مسجل
if(user){
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('userNameDisplay').innerText=user.name;
    document.getElementById('userTagDisplay').innerText=user.tag;
    document.getElementById('myAvatarDisplay').src=user.avatar || 'https://via.placeholder.com/100';
    loadPosts(); loadRequests(); loadFriends();
}

// التنقل بين الصفحات
function tab(t){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden')); document.getElementById('p-'+t).classList.remove('hidden');}

// تحديث البروفايل
function updateAvatar(){ 
    const url=avatarUrlInput.value.trim(); 
    if(url){ 
        db.ref('users/'+user.name+'/avatar').set(url).then(()=>{
            user.avatar=url;
            localStorage.setItem('app_user',JSON.stringify(user));
            myAvatarDisplay.src=url;
            alert("تم تحديث البروفايل!");
        });
    }
}

// المنشورات
function post(){
    const t=pTxt.value.trim();
    const img=pImgUrl.value.trim();
    if(t||img){
        db.ref('posts').push({ u:user.name, utag:user.tag, t:t, img:img, avatar:user.avatar||'' });
        pTxt.value=""; pImgUrl.value="";
    }
}
function loadPosts(){
    db.ref('posts').on('value', s=>{
        const f=feed; f.innerHTML="";
        s.forEach(p=>{
            const d=p.val();
            f.insertAdjacentHTML('afterbegin',`
                <div class="card">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <img src="${d.avatar||'https://via.placeholder.com/45'}" class="u-img">
                        <div style="display:flex;flex-direction:column;">
                            <b>${d.u}</b> <span class="user-tag">${d.utag||d.u+'#0000'}</span>
                        </div>
                    </div>
                    <p>${d.t}</p>
                    ${d.img?`<img src="${d.img}" class="post-img" onerror="this.style.display='none'">`:''}
                    <button class="btn" style="width:auto;background:#eee;color:#333;margin-top:10px;" onclick="like('${p.key}')">👍 ${d.likes?Object.keys(d.likes).length:0} لايك</button>
                </div>`);
        });
    });
}
function like(id){
    const r=db.ref('posts/'+id+'/likes/'+user.name);
    r.once('value', s=>{ s.exists()?r.remove():r.set(true); });
}

// الأصدقاء
function addFriend(){
    const tag=friendTagI.value.trim();
    db.ref('users').once('value', s=>{
        let found=null;
        s.forEach(u=>{ if(u.val().tag===tag) found=u.key; });
        if(found && found!==user.name){
            db.ref('reqs/'+found+'/'+user.name).set({ n:user.name, t:user.tag });
            notify("friend","لديك طلب صداقة من "+user.name,user.name);
            alert("تم الإرسال");
        } else alert("غير موجود");
    });
}
function loadRequests(){
    db.ref('reqs/'+user.name).on('value', s=>{
        reqsArea.innerHTML="";
        s.forEach(r=>{
            reqsArea.innerHTML+=`<div class="card" style="display:flex;justify-content:space-between;">
                <span>${r.val().n}</span>
                <button class="btn" style="width:60px;" onclick="accept('${r.key}')">قبول</button>
            </div>`;
        });
    });
}
function accept(n){
    db.ref('users/'+user.name+'/friends/'+n).set(true);
    db.ref('users/'+n+'/friends/'+user.name).set(true);
    db.ref('reqs/'+user.name+'/'+n).remove();
}
function loadFriends(){
    db.ref('users/'+user.name+'/friends').on('value', s=>{
        friendsList.innerHTML="<h4>الأصدقاء</h4>";
        s.forEach(f=>{ friendsList.innerHTML+=`<div class="card" onclick="chat('${f.key}')" style="cursor:pointer">👤 ${f.key}</div>`; });
    });
}

// الدردشة
function chat(n){
    activeChat=n; chatBox.classList.remove('hidden'); chatTitle.innerText=n;
    const room=user.name<n?user.name+"_"+n:n+"_"+user.name;
    db.ref('chats/'+room).on('value', s=>{
        msgsDisplay.innerHTML="";
        s.forEach(m=>{
            const side=m.val().s===user.name?'m-me':'m-him';
            msgsDisplay.innerHTML+=`<div class="msg ${side}">${m.val().t}</div>`;
        });
        msgsDisplay.scrollTop=msgsDisplay.scrollHeight;
    });
}
function sendMsg(){
    const t=msgInput.value.trim();
    if(!t||!activeChat) return;
    const room=user.name<activeChat?user.name+"_"+activeChat:activeChat+"_"+user.name;
    db.ref('chats/'+room).push({ s:user.name, t:t });
    notify("msg","رسالة جديدة من "+user.name,activeChat);
    msgInput.value="";
}
function closeChat(){ chatBox.classList.add('hidden'); }
function logout(){ localStorage.clear(); location.reload(); }

// إشعارات
function notify(type,text,from){ 
    const id=Date.now();
    db.ref('notifs/'+user.name+'/'+id).set({ t:text, type:type, from:from, time:Date.now() });
}
function openNotifs(){ notifBox.classList.remove('hidden'); }
function closeNotifs(){ notifBox.classList.add('hidden'); }
db.ref('notifs/'+(user?user.name:'')).on('value',s=>{
    let c=0; notifList.innerHTML="";
    s.forEach(n=>{ c++; notifList.innerHTML+=`<div class="card">${n.val().t}</div>`; });
    notifCount.innerText=c;
});
</script>
</body>
</html>
